name: Waka Readme

on:
  schedule:
    # Todos los domingos a las 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIME_RANGE: last_7_days
          LANG_COUNT: 8
          SHOW_TOTAL: true

      - name: Checkout updated README
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Write last update date
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          sed -i "s|<!--START_UPDATED-->.*<!--END_UPDATED-->|<!--START_UPDATED-->${DATE}<!--END_UPDATED-->|" README.md
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Updated WakaTime last update date"
            git push
          fi
